item_name: hello
display_name: Hello
description: A small command-line tool, packaged with embala
category: Utilities
developer: Example Corp
icon_name: hello.png
restart_action: None
# update_for: names of items this package is an update for
# blocking_apps: process image names, case-insensitive, trailing `.exe` optional
# installable_condition: install only where this expression is true; see site/src/content/docs/guides/conditions.md
# installable_condition: arch == "amd64" && os_build >= 19045
# depends_check: software this item needs and sofcat does not install for it; see site/src/content/docs/guides/required-software.md
# depends_check:
#   - display_name: Demo Tool   # shown in "Needs Demo Tool. Install it first, then try again."
#     sofcat: demo-tool         # a catalog item name, installed on this machine (every OS)
#     munki: DemoTool           # macOS: InstalledItems in Munki's ManagedInstallReport.plist
#     script:                   # exit 0 means present
#       windows: |
#         if (Get-Command demo-tool -ErrorAction SilentlyContinue) { exit 0 }
#         exit 1
#       darwin: |
#         #!/bin/sh
#         command -v demo-tool
# A zip item (installer.type zip, with variants per placement and OS) is not
# written by hand: makecatalogs build generates it from item trees. See
# site/src/content/docs/zip-items/overview.md and examples/zip-items/.
blocking_apps:
  - hello
# No check block: sofcat checks a nupkg item against its kept copy of the
# package, found by installer.package_id. A check block, when present, wins.
# See site/src/content/docs/guides/nupkg-items.md.
installer:
  hash: 3f1c9a7e52b84d06a1e9c3b7d25f8a64e0b1c7d93a5f2e86b4d0c1a9e7f35b28
  location: packages/apps/hello/hello.1.2.0.nupkg
  # package_id: the nuspec id. Required without a check block; the install
  # fails if the package's id differs.
  package_id: hello
  type: nupkg
  # success_codes: non-zero exit codes that still mean success. msi and nupkg
  # default to [1641, 3010] (restart required); listing codes replaces the default.
# uninstaller: needed to remove the item. sofcat runs the kept copy's uninstall
# script, and this file's only when there is no kept copy.
uninstaller:
  hash: 3f1c9a7e52b84d06a1e9c3b7d25f8a64e0b1c7d93a5f2e86b4d0c1a9e7f35b28
  location: packages/apps/hello/hello.1.2.0.nupkg
  type: nupkg
# Uninstall-side scripts, mirroring preinstall_script/postinstall_script
preuninstall_script: |
  Stop-Process -Name hello -ErrorAction SilentlyContinue
postuninstall_script: |
  Remove-Item -Recurse -Force "$env:ProgramData\Hello" -ErrorAction SilentlyContinue
# version: must equal the nuspec version, compared as versions (1.2 equals
# 1.2.0). Left out, the item takes the package's version.
version: 1.2.0
catalog: testcatalog
