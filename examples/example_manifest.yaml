name: example_manifest
managed_installs:
  - Chocolatey
  - GoogleChrome
optional_installs:
  - VLC
  - Slack
default_installs:
  - Slack
managed_updates:
  - ChefClient
  - CanonDrivers
conditional_items:
  - condition: os == "windows"
    managed_installs:
      - 7zip
    conditional_items:
      - condition: arch == "arm64"
        managed_installs:
          - ArmTools
  - condition: '"lab" in machine_groups'
    optional_installs:
      - CUDA
    managed_uninstalls:
      - OldLabTool
