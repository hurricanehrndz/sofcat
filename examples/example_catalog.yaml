hello:
  display_name: Hello
  # A nupkg built by embala 0.10.0 or later with the scripts key. sofcat runs
  # the package's own scripts and keeps a copy of the package; see
  # site/src/content/docs/guides/nupkg-items.md. With no check block, status
  # comes from that kept copy, so package_id is required and must equal the
  # nuspec id.
  installer:
    hash: 3f1c9a7e52b84d06a1e9c3b7d25f8a64e0b1c7d93a5f2e86b4d0c1a9e7f35b28
    location: packages/apps/hello/hello.1.2.0.nupkg
    package_id: hello
    type: nupkg
  # Removal runs the kept copy's uninstall script, or this file's when there
  # is no kept copy.
  uninstaller:
    hash: 3f1c9a7e52b84d06a1e9c3b7d25f8a64e0b1c7d93a5f2e86b4d0c1a9e7f35b28
    location: packages/apps/hello/hello.1.2.0.nupkg
    type: nupkg
  version: 1.2.0
ColorPrinter:
  dependencies:
    - Canon-Drivers
  display_name: Color Printer
  # custom_action_labels: storefront labels for this item, Munki's keys plus
  # cancel, the pending statuses and the applies-to prefix (install,
  # installing, installed, remove, removing, update, cancel, pending_install,
  # pending_remove, applies_to).
  # A key left out falls back to the item's placements (zip items, see
  # site/src/content/docs/zip-items/placements.md), then the built-in label. Shown as plain text.
  custom_action_labels:
    install: Add printer
    installing: Adding printer…
    installed: Printer added
    pending_install: Printer will be added
  # depends_check: software the item needs and sofcat does not install for it.
  # While any entry is missing on this OS, installs and updates are deferred
  # (missing_software). An entry is present when any check that applies on
  # this OS passes: sofcat (a catalog item name, every OS), munki (a Munki item
  # name, macOS) or script (windows: PowerShell as SYSTEM; darwin: runs as
  # root, must start with #!). Exit 0 means present.
  depends_check:
    - display_name: Print Spooler Tools
      sofcat: print-spooler-tools
      munki: PrintSpoolerTools
      script:
        windows: |
          if (Get-Command print-spooler-tools -ErrorAction SilentlyContinue) { exit 0 }
          exit 1
  installer:
    hash: a8b4ff8bc7d77036644c1ed04713c550550f180e08da786fbca784818b918dac
    location: packages/colorprinter.1.0.nupkg
    package_id: colorprinter
    type: nupkg
  version: 1.0
