url: https://example.com/sofcat/
manifest: example_manifest
catalogs:
  - example_catalog
app_data_path: c:/cpe/sofcat/cache
# auth_user: johnny
# auth_pass: pizza
# Mutual TLS. The client certificate comes from the machine store (Windows
# LocalMachine\My, the macOS System keychain): a regular expression on its
# subject CN, or on issuer, serial or dns_names with tls_client_cert_store_field.
# Or give PEM files with tls_client_cert and tls_client_key instead. Without
# tls_server_cert the system roots verify the server.
# tls_auth: true
# tls_client_cert_store: ^device-.*\.corp\.example\.com$
# tls_client_cert_store_field: subject
# tls_server_cert: c:/cpe/sofcat/repo-ca.pem
# service_name: sofcat
# service_interval: 1h
# service_pipe_name: sofcat-service
# Optional organisation branding for SofCat UI. Managed settings (registry key
# HKLM\SOFTWARE\Policies\SofCat\branding, or the `branding` dict in the macOS
# managed preferences plist) override each field. Leave the block
# out to keep the default look.
# branding:
#   title: Acme Software Center
#   tagline: Need help? Call the service desk at ext. 1234.
#   logo: C:\ProgramData\SofCat\branding\logo.png   # local PNG, JPEG or SVG, at most 512 KiB
#   help_url: https://help.example.com/               # http or https only
#   help_label: Get help
#   accent: "#0b6e4f"                                 # 6-digit hex
#   background_image: C:\ProgramData\SofCat\branding\banner.jpg  # local PNG, JPEG or SVG, at most 1 MiB; fills the banner in place of the accent
#   list_heading: Software for your team              # replaces "Available software"
#   sections:                                         # storefront tab order; unlisted sections follow alphabetically
#     - Apps
#     - Branding
#     - Utilities
