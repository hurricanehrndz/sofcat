url: https://example.com/sofcat/
manifest: example_manifest
catalogs:
  - example_catalog
app_data_path: c:/cpe/sofcat/cache
# auth_user: johnny
# auth_pass: pizza
# Mutual TLS. The client certificate comes from the machine store (Windows
# LocalMachine\My, the macOS System keychain): a regular expression on its
# subject CN, or on issuer, serial or dns_names with tls_client_cert_store_field.
# Or give PEM files with tls_client_cert and tls_client_key instead. Without
# tls_server_cert the system roots verify the server.
# tls_auth: true
# tls_client_cert_store: ^device-.*\.corp\.example\.com$
# tls_client_cert_store_field: subject
# tls_server_cert: c:/cpe/sofcat/repo-ca.pem
# service_name: sofcat
# service_interval: 1h
# service_pipe_name: sofcat-service
# Optional organisation branding for SofCat UI. Managed settings (registry key
# HKLM\SOFTWARE\Policies\SofCat\branding, or the `branding` dict in the macOS
# managed preferences plist) override each field. Leave the block
# out to keep the default look.
# branding:
#   title: Acme Software Center
#   tagline: Need help? Call the service desk at ext. 1234.
#   logo: C:\ProgramData\SofCat\branding\logo.png   # local PNG, JPEG or SVG, at most 512 KiB
#   link_url: https://help.example.com/               # a button that opens it; http or https only (help_url, the old name, still works)
#   link_label: Get help                              # the button's text, default "Get help" (help_label still works)
#   link_placement: banner                            # banner (default) or app_bar (at the bar's right end, before the connection status)
#   link_position: auto                               # in the banner: auto (default; follows banner_align), top_left, top_right, bottom_left or bottom_right
#   accent: "#0b6e4f"                                 # 6-digit hex
#   background_image: C:\ProgramData\SofCat\branding\banner.jpg  # local PNG, JPEG or SVG, at most 1 MiB; fills the banner in place of the accent
#   background_text: light                            # banner text over the image: light (default) or dark
#   list_heading: Software for your team              # replaces "Available software"
#   title_size: large                                 # banner title and page headings: small, medium (default), large or x-large
#   tagline_size: medium                              # banner tagline: the same sizes
#   content_width: wide                               # compact (the layout before this key), wide (default) or full
#   nav_placement: top                                # the bar with the product, pages and connection status: top (default; across the window) or left (a column down its side)
#   category_filter: select                           # a list's categories: select (default; beside the search field) or list (buttons in the bar, with nav_placement: left only)
#   filter_placement: right                           # search and category: right (default; on the heading's row, at its right edge) or left (above the heading, as before)
#   banner_style: text                                # text (default; logo tile beside the title) or logo (logo in the title's place, title as its alt text);
#                                                     #   examples/branding/sofcat-logo-banner-light.svg (dark banners) and -dark.svg (light ones)
#   banner_align: left                                # banner logo, title and tagline: left (default), center or right
#   banner_height: medium                             # banner minimum height: small (slim), medium (default), large or x-large; content grows it
#   app_bar_brand: full                               # app bar: full (default; mark and name), mark or none; for use with the banner
#   progress: strip                                   # running work: strip (default; a bar along the bottom) or button (in each item's button,
#                                                     #   with a Cancel beside it; the strip only counts two or more and opens their list)
#   item_view: page                                   # how a card opens its item: page (default; a detail page in the list's place) or dialog (over the list)
#   sections:                                         # storefront tab order; unlisted sections follow alphabetically
#     - Apps
#     - Branding
#     - Utilities
