# placements.yaml sits at the repository root, next to catalogs/ and
# manifests/. It names the placements zip items are written to. See
# site/src/content/docs/zip-items/placements.md. Unknown fields are rejected.
#
# The paths below are illustrative. Keep every path inside the build's write
# roots.
#
# Facts makecatalogs -check renders templates with, over a sample of every
# built-in fact (see the conditions guide): the admin facts the templates
# read, with the values to check them against.
check_facts:
  site: east
placements:
  # The key is the placement name. Item files list it under placements: and
  # catalog variants use it.
  # A placement with paths is a directory: one tree per item at
  # <path>/<item_name>.
  wallpapers:
    # The placement root per OS. Only darwin and windows. Windows paths may use
    # ${ProgramFiles} and ${ProgramData}. The user's home, ${USERPROFILE} on
    # Windows and ${HOME} on macOS, only where the scope for that OS is user.
    paths:
      darwin: /Library/Application Support/Acme/Wallpapers
      windows: ${ProgramData}\Acme\Wallpapers
    # Display names for the self-service app's line "Applies to: Desktop".
    # Display only: it does not limit where the item goes.
    applies_to: [Desktop]
    # Optional overrides for the app's labels. Keys: install, installing,
    # installed, remove, removing, update, cancel, pending_install,
    # pending_remove, and applies_to, the prefix of that line.
    action_labels:
      install: Add
      installed: Added
    # Files sofcat renders from the placement's receipts (.Items) after every
    # change to it; see the guide, "Placement files". An entry has a template
    # and either path, relative to the placement root, or paths, one per OS.
    # The template is inline, as template, or in a file of its own, named by
    # template_file relative to this directory: this one is
    # templates/wallpapers-index.json.tmpl.
    # An empty output removes the file, so {{ if .Items }} decides whether it
    # stays with nothing placed. fact and cond read the machine's facts. A
    # .json file is rewritten in canonical form, so only the values matter.
    files:
      - paths:
          darwin: /Library/Application Support/Acme/wallpapers-index.json
          windows: ${ProgramData}\Acme\wallpapers-index.json
        template_file: templates/wallpapers-index.json.tmpl
  meeting-backgrounds:
    paths:
      darwin: /Library/Application Support/Acme/Meeting Backgrounds
      windows: ${USERPROFILE}\Pictures\Acme Meeting Backgrounds
    # machine or user per OS. An OS left out is machine. This one is machine
    # scope on macOS and per user on Windows. In user scope the per-user helper
    # places the trees and writes any files.
    scope:
      windows: user
    applies_to: [Video calls]
  brand-library:
    paths:
      darwin: /Library/Application Support/Acme/Brand Library
      windows: ${ProgramData}\Acme\Brand Library
    applies_to: [Desktop, Video calls]
    # Refuse to write into this directory if it already exists, is not empty
    # and sofcat did not create it.
    exclusive: true
    # Item trees go to <path>/packs/<item_name> rather than <path>/<item_name>.
    items_dir: packs
    # Free data for the templates, as .Placement.Vars.
    vars:
      name: acme
      owner: {name: Acme IT}
      # renames: {old-pack: new-pack}
    # A catalog of the packs, whose version carries the placed hash (so it
    # changes whenever a rendered file in the pack changes), and a per-OS
    # index outside the library that lists the packs shipped by default,
    # keyed <pack>@<name>, removed when no pack is left. A relative path must
    # not reach into item trees: its first segment differs from items_dir's.
    # A file that is refused or fails to render keeps its old contents and
    # the others are still written; files_atomic: true writes none instead.
    # files_atomic: true
    files:
      - path: library.json
        template: |
          {
            "name": {{ json .Placement.Vars.name }},
            "owner": {{ json .Placement.Vars.owner }},
            {{- if ne (index .Placement.Vars "renames") nil }}
            "renames": {{ json .Placement.Vars.renames }},
            {{- end }}
            "packs": [
              {{- range $i, $p := .Items }}{{ if $i }},{{ end }}
              {
                "name": {{ json $p.Name }},
                "path": {{ json (printf "./packs/%s" $p.Name) }},
                "version": "{{ $p.Version }}+{{ slice $p.PlacedHash 7 19 }}",
                "managed": {{ $p.Managed }}
              }
              {{- end }}
            ]
          }
      - paths:
          darwin: /Library/Application Support/Acme/library.d/50-acme.json
          windows: ${ProgramData}\Acme\library.d\50-acme.json
        template: |
          {{- if .Items }}
          {{- $enabled := dict }}
          {{- range .Items }}{{ if .Managed }}{{ $_ := set $enabled (printf "%s@%s" .Name $.Placement.Vars.name) true }}{{ end }}{{ end }}
          {
            "libraries": {
              {{ json .Placement.Vars.name }}: {"path": {{ json .Placement.Root }}}
            },
            "enabledPacks": {{ json $enabled }}
          }
          {{- end }}
  # No paths: a rootless placement holds no items and only writes its files,
  # each at its own absolute path, on every managed run of every device that
  # reads this file. Machine scope only, and the app never shows it. Its
  # templates see no root and no items, so fact and cond make the per-device
  # differences.
  site-settings:
    files:
      - paths:
          darwin: /Library/Application Support/Acme/site.json
          windows: ${ProgramData}\Acme\site.json
        template: |
          {"site": {{ json (fact "site") }}}
      # ensure: absent (the default is present) removes the file on every run
      # where it exists, and takes no template. sofcat keeps no record of the
      # files it wrote: an entry dropped from this file leaves its file
      # behind, so mark it absent first and delete it once devices have run.
      - paths:
          darwin: /Library/Application Support/Acme/old-site.json
          windows: ${ProgramData}\Acme\old-site.json
        ensure: absent
