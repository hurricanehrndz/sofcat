# Toolchain for contributors. `mise install` fetches everything; `mise run`
# is not used: tasks live in the justfile.
[tools]
go = "1.27"
node = "24"
just = "1.58"
golangci-lint = "2.14.0"
gofumpt = "0.12"
yamlfmt = "0.21"
"ubi:numtide/treefmt" = "2.5.0"
"github:hurricanehrndz/embala" = "0.7.0"
prek = "0.5.5"
actionlint = "1.7.12"
