# Toolchain for contributors. `mise install` fetches everything; `mise run`
# is not used: tasks live in the justfile.
[tools]
go = "1.27"
node = "24"
just = "1.59"
golangci-lint = "2.15.0"
gofumpt = "0.12"
yamlfmt = "0.21"
"ubi:numtide/treefmt" = "2.6.0"
"github:hurricanehrndz/embala" = "0.9.0"
prek = "0.5.7"
actionlint = "1.7.12"

# On Linux with nix, also load flake.nix (GTK/WebKit for the UI); see the script.
[env]
_.source = "nix-env.sh"
