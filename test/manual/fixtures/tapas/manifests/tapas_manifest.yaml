name: tapas_manifest
catalogs:
  - tapas
managed_installs:
  - tapas-managed-skill
  - tapas-managed-plugin
  - tapas-exe-item
  - tapas-desktop-managed
  - tapas-user-skill
  - tapas-user-plugin
  - tapas-policy-user-skill
optional_installs:
  - tapas-optional-skill
  - tapas-adopt-skill
  - tapas-foreign-skill
  - tapas-outside-skill
  - tapas-optional-plugin
  - tapas-second-plugin
  - tapas-depends-skill
  - tapas-exclusive-skill
  - tapas-desktop-optional
  - tapas-optional-user-skill
# Placed by the startup run like a managed install, but a default the smokes'
# last step can deselect: a required item is never removable, and emptying
# exclusive-skills is what removes its exclusive-index.json.
default_installs:
  - tapas-exclusive-skill
conditional_items:
  # run-tapas-smoke.ps1 sets these facts with an admin condition script. Until
  # it does, both facts are missing, so both blocks are held.
  - condition: tapas_smoke_scope == "in"
    managed_installs:
      - tapas-scoped-skill
  - condition: tapas_smoke_held == "yes"
    managed_installs:
      - tapas-held-skill
  # The smokes' Desktop script sets tapas_desktop_managed to "no" and later
  # to "yes": the optional Desktop plugin, already placed by self-service,
  # moves into managed_installs and its plugin.json re-renders in place. The
  # admin manifest is served from the host, so the smokes cannot edit it; the
  # fact is how they move an item between the two lists.
  - condition: tapas_desktop_managed == "yes"
    managed_installs:
      - tapas-desktop-optional
