# Input to makecatalogs build; just bootstrap-tapas packs item-trees/tapas-depends-skill.
# run-tapas-smoke.ps1 installs it before and after creating the marker file
# its Windows depends_check script looks for; run-tapas-smoke.sh before and
# after writing a Munki report that lists DemoTool.
item_name: tapas-depends-skill
placements: [claude-skills]
display_name: Tapas Depends Skill
section: Skills
description: A self-service skill that needs Demo Tool installed first
catalog: tapas
version: 1.0.0
depends_check:
  - display_name: Demo Tool
    munki: DemoTool
    script:
      windows: |
        if (Test-Path -LiteralPath "$env:ProgramData\tapas-test-smoke\demo-tool-installed.txt") { exit 0 }
        exit 1
