# Input to makecatalogs zip-item; just bootstrap-tapas packs rendered/tapas-scripted-skill.
# Its postinstall_script makes the zip-only Tapas Test build reject it: it is
# neither listed nor installed, and the script never runs.
item_name: tapas-scripted-skill
display_name: Tapas Scripted Skill
description: A self-service skill with a postinstall_script
catalog: tapas
version: 1.0.0
postinstall_script: |
  Set-Content -LiteralPath "$env:ProgramData\tapas-test-smoke\scripted-skill-ran.txt" -Value ran
