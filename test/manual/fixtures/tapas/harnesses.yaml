# Placements of the Tapas smoke repository (docs/zip-items.md). Every machine
# placement except outside-skills sits under the fixture brand's write root,
# ${ProgramData}\tapas-test-smoke (brand/write-roots.yaml).
placements:
  claude-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/claude/skills
      windows: ${ProgramData}\tapas-test-smoke\claude\skills
    works_in: [Claude Code]
  # sofcat creates this root, so it gets the .tapas-test-owned marker.
  exclusive-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/exclusive/skills
      windows: ${ProgramData}\tapas-test-smoke\exclusive\skills
    works_in: [Claude Code]
    exclusive: true
  # The smoke fills this root with an unmarked file first, so it is refused.
  foreign-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/foreign/skills
      windows: ${ProgramData}\tapas-test-smoke\foreign\skills
    works_in: [Claude Code]
    exclusive: true
  # Per user on Windows: the service skips it.
  codex-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/codex/skills
      windows: ${USERPROFILE}\.agents\skills
    scope:
      windows: user
    works_in: [Codex]
  # Outside every write root: refused.
  outside-skills:
    kind: directory
    paths:
      windows: ${ProgramData}\tapas-test-outside\skills
    works_in: [Claude Code]
