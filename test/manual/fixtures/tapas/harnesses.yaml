# Placements of the Tapas smoke repository (site/src/content/docs/guides/zip-items.md). Every machine
# placement except outside-skills sits under the fixture brand's write root,
# ${ProgramData}\tapas-test-smoke on Windows and
# /Library/Application Support/Tapas Test on macOS (brand/write-roots.yaml).
#
# makecatalogs renders the tree templates (tapas-desktop-managed's .mcp.json)
# with this admin fact over the built-in samples; the smokes' condition
# script provides it on the device.
check_facts:
  assigned_user: jdoe
placements:
  claude-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/claude/skills
      windows: ${ProgramData}\tapas-test-smoke\claude\skills
    works_in: [Claude Code]
    action_labels: {install: Add, installed: Added, pending_install: Will be added}
  # sofcat creates this root, so it gets the .tapas-test-owned marker.
  exclusive-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/exclusive/skills
      windows: ${ProgramData}\tapas-test-smoke\exclusive\skills
    works_in: [Claude Code]
    exclusive: true
  # The smoke fills this root with an unmarked file first, so it is refused.
  foreign-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/foreign/skills
      windows: ${ProgramData}\tapas-test-smoke\foreign\skills
    works_in: [Claude Code]
    exclusive: true
  # Per user on Windows: the service skips it. Per machine on macOS.
  codex-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/codex/skills
      windows: ${USERPROFILE}\.agents\skills
    scope:
      windows: user
    works_in: [Codex]
  # Claude Desktop style organization plugins, whose trees ship templates:
  # .claude-plugin/plugin.json.tmpl sets installationPreference from the
  # managed flag, and tapas-desktop-managed's .mcp.json.tmpl reads the
  # assigned_user admin fact and branches on the os built-in.
  tapas-desktop-plugins:
    kind: directory
    paths:
      darwin: /Library/Application Support/Tapas Test/desktop/org-plugins
      windows: ${ProgramData}\tapas-test-smoke\desktop\org-plugins
    works_in: [Claude Desktop]
  # Outside every write root: refused.
  outside-skills:
    kind: directory
    paths:
      darwin: /Library/Application Support/tapas-test-outside/skills
      windows: ${ProgramData}\tapas-test-outside\skills
    works_in: [Claude Code]
  # A marketplace sofcat creates, so it gets the marker: plugins under
  # plugins\<item>, a generated .claude-plugin\marketplace.json, and a
  # Codex-format catalog rendered from a template, its versions stamped with
  # each plugin's placed hash.
  tapas-marketplace:
    kind: marketplace
    paths:
      darwin: /Library/Application Support/Tapas Test/marketplace
      windows: ${ProgramData}\tapas-test-smoke\marketplace
    works_in: [Claude Code, Codex]
    action_labels:
      install: Make available
      installing: Making available…
      installed: Available
      remove: Withdraw
      pending_install: Will be available
      pending_remove: Will be withdrawn
    exclusive: true
    marketplace:
      name: tapas-test
      owner: {name: Tapas Test}
      renames: {old-plugin: tapas-managed-plugin}
      allowCrossMarketplaceDependenciesOn: [other]
      manifest_files:
        - .claude-plugin/marketplace.json
        - path: .agents/plugins/marketplace.json
          template: |
            {
              "name": {{ json .Placement.Marketplace.Name }},
              "interface": {"displayName": {{ json .Placement.Marketplace.Owner.name }}},
              "plugins": [
                {{- range $i, $p := .Items }}{{ if $i }},{{ end }}
                {
                  "name": {{ json $p.Name }},
                  "version": "{{ $p.Version }}+{{ slice $p.PlacedHash 7 19 }}",
                  "source": {"source": "local", "path": "./plugins/{{ $p.Name }}"},
                  "policy": {
                    "installation": {{ if $p.Managed }}"INSTALLED_BY_DEFAULT"{{ else }}"AVAILABLE"{{ end }},
                    "authentication": "ON_INSTALL"
                  }
                }
                {{- end }}
              ]
            }
  # The drop-in that registers tapas-marketplace and enables its managed
  # plugins.
  tapas-settings:
    kind: settings
    paths:
      darwin: /Library/Application Support/Tapas Test/claude/managed-settings.d/50-tapas-test.json
      windows: ${ProgramData}\tapas-test-smoke\claude\managed-settings.d\50-tapas-test.json
    works_in: [Claude Code]
    registers: tapas-marketplace
  # A templated registration of the claude-skills directory: a JSON index of
  # the skills placed there, with the OS fact, removed when none is left.
  tapas-skills-index:
    kind: settings
    paths:
      darwin: /Library/Application Support/Tapas Test/claude/skills-index.json
      windows: ${ProgramData}\tapas-test-smoke\claude\skills-index.json
    works_in: [Claude Code]
    registers: claude-skills
    template: |
      {{- if .Items }}
      {
        "os": {{ json (fact "os") }},
        "root": {{ json .Registers.Root }},
        "skills": {{ json .Items }}
      }
      {{- end }}
  # The same for exclusive-skills, whose only item the smokes remove last: it
  # exists to show the file disappears once nothing is registered.
  tapas-exclusive-index:
    kind: settings
    paths:
      darwin: /Library/Application Support/Tapas Test/claude/exclusive-index.json
      windows: ${ProgramData}\tapas-test-smoke\claude\exclusive-index.json
    works_in: [Claude Code]
    registers: exclusive-skills
    template: |
      {{- if .Items }}
      {"skills": [{{ range $i, $p := .Items }}{{ if $i }}, {{ end }}{{ json $p.Name }}{{ end }}]}
      {{- end }}
