# SofCat installer definition for embala (https://github.com/hurricanehrndz/embala).
# `just setup` copies the built executables beside rendered copies of this
# file, install.lua and uninstall.lua under build/setup/ and runs `embala build`
# there, so `src` paths are plain file names. @VERSION@ is the package version
# (major.minor.patch); the other @PLACEHOLDERS@ are the justfile brand values
# (stock SofCat unless `just brand=…`).
#
# The setup.exe puts both executables in C:\Program Files\SofCat and runs
# `sofcat.exe -serviceinstall`, which registers and starts the SofCat service
# and writes the HKLM Run value sofcat-user-sync that starts
# `sofcat-ui.exe --user-sync` at every logon (docs/zip-items.md); its
# uninstaller runs `sofcat.exe -serviceremove`, which undoes both. sofcat owns
# its service and that value, so the scripts only call it. The installer ships
# no config.yaml: management tooling writes C:\ProgramData\SofCat\config.yaml,
# and the service runs with defaults (every managed run failing) until that
# file exists and the service restarts.

[package]
name = "@APP@"
display-name = "@PRODUCT@"
version = "@VERSION@"
identifier = "@IDENTIFIER@"
publisher = "@PUBLISHER@"
description = "@DESCRIPTION@"
homepage = "@HOMEPAGE@"
license = "Apache-2.0"

[setup]
arch = "x86_64"
install-mode = "per-machine"
files = [
  { src = "@APP@.exe", dest = "@APP@.exe" },
  { src = "@APP@-ui.exe", dest = "@APP@-ui.exe" },
]
# Raw scripts: the shortcut and ARP entry live in install.lua, since `script`
# cannot be combined with `main-executable` or `shortcuts`.
script = "install.lua"
uninstall-script = "uninstall.lua"
