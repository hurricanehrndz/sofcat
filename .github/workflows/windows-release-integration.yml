name: Windows Released-Binary Integration
# Two entry points:
# - workflow_call from Build Release tests the sofcat.exe that run just built.
# - workflow_dispatch ("Run workflow", needs write access) tests a pull
#   request: it builds sofcat.exe from refs/pull/<pr>/merge and reports a
#   check run and a comment on the PR.
# PR code only ever runs in the read-only `integration` job; the jobs that
# hold write permissions (`start`, `finish`) run no repository code.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test
        required: true
        type: number
      fixtures:
        description: prebuilt reuses main's latest fixture artifact; full rebuilds the fixtures
        type: choice
        options:
          - prebuilt
          - full
        default: prebuilt
permissions:
  contents: read
jobs:
  start:
    name: Report start on PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pr_meta.outputs.head_sha }}
      check_run_id: ${{ steps.check_start.outputs.check_run_id }}
      comment_id: ${{ steps.comment_start.outputs.comment_id }}
    steps:
      - name: Resolve PR head sha
        id: pr_meta
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: Number("${{ inputs.pr }}") });
            core.setOutput("head_sha", pr.data.head.sha);
      - name: Create in-progress check run
        id: check_start
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const response = await github.rest.checks.create({
              owner,
              repo,
              name: "Windows Released-Binary Integration",
              head_sha: "${{ steps.pr_meta.outputs.head_sha }}",
              status: "in_progress",
              details_url: runUrl,
              output: {
                title: "Integration test started",
                summary: `Started by @${context.actor} from Run workflow.\n\nRun: ${runUrl}`
              }
            });
            core.setOutput("check_run_id", String(response.data.id));
      - name: Comment start on PR
        id: comment_start
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const comment = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number("${{ inputs.pr }}"),
              body: [
                "<!-- sofcat-integration-status -->",
                `Windows integration test started by @${context.actor}.`,
                "",
                `Run: ${runUrl}`
              ].join("\n")
            });
            core.setOutput("comment_id", String(comment.data.id));
  integration:
    name: Run Integration on Windows VM
    needs: start
    # start is skipped under workflow_call; run anyway, but not when start failed.
    if: ${{ !cancelled() && needs.start.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # download artifacts from this and other runs
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.sha }}
          persist-credentials: false
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download sofcat.exe from the Build Release run
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofcat-exe-release
          path: ${{ runner.temp }}/sofcat-artifact
      - name: Build sofcat.exe from PR merge ref
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $outDir = "${{ runner.temp }}\sofcat-binary"
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          go build -v -o "$outDir\sofcat.exe" ./cmd/sofcat
      - name: Resolve latest integration fixture run
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != 'full'
        id: fixture_run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "build-integration-fixtures.yml",
              branch: "main",
              event: "push",
              status: "completed",
              per_page: 100
            });
            const latestSuccess = runs.find((run) => run.conclusion === "success");
            if (!latestSuccess) {
              core.warning("No successful main-branch fixture run found. Falling back to local fixture build.");
              return;
            }
            core.setOutput("run_id", String(latestSuccess.id));
      - name: Download prebuilt fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != 'full' && steps.fixture_run.outputs.run_id != ''
        id: fixture_download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.fixture_run.outputs.run_id }}
          name: sofcat-release-fixtures
          path: ${{ runner.temp }}/sofcat-release-integration/fixture
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve sofcat.exe path
        shell: pwsh
        run: |
          $candidate1 = "${{ runner.temp }}\sofcat-artifact\sofcat.exe"
          $candidate2 = "${{ runner.temp }}\sofcat-binary\sofcat.exe"

          if (Test-Path -LiteralPath $candidate1) {
            "SOFCAT_EXE_PATH=$candidate1" >> $env:GITHUB_ENV
            exit 0
          }

          if (Test-Path -LiteralPath $candidate2) {
            "SOFCAT_EXE_PATH=$candidate2" >> $env:GITHUB_ENV
            exit 0
          }

          throw "Unable to resolve sofcat.exe path"
      - name: Prepare released-binary integration fixtures
        if: github.event_name != 'workflow_dispatch' || inputs.fixtures == 'full' || steps.fixture_download.outcome != 'success'
        shell: pwsh
        run: |
          $workRoot = "$env:RUNNER_TEMP\sofcat-release-integration"
          ./test/integration/prepare-release-integration.ps1 `
            -WorkRoot "$workRoot"
      - name: Run released-binary integration tests
        shell: pwsh
        run: |
          $workRoot = "$env:RUNNER_TEMP\sofcat-release-integration"
          ./test/integration/run-release-integration.ps1 `
            -WorkRoot "$workRoot" `
            -SofCatExePath "$env:SOFCAT_EXE_PATH"
  finish:
    name: Report result on PR
    needs: [start, integration]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.start.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Finalize check run
        if: needs.start.outputs.check_run_id != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = "${{ needs.integration.result }}";
            let conclusion = "failure";
            if (result === "success") conclusion = "success";
            if (result === "cancelled") conclusion = "cancelled";
            if (result === "skipped") conclusion = "neutral";

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number("${{ needs.start.outputs.check_run_id }}"),
              status: "completed",
              conclusion,
              details_url: runUrl,
              output: {
                title: `Integration ${conclusion}`,
                summary: `Integration job finished with result: ${result}.\n\nRun: ${runUrl}`
              }
            });
      - name: Finalize PR comment
        if: needs.start.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = "${{ needs.integration.result }}";
            const state = result === "success" ? "passed" : (result === "cancelled" ? "was cancelled" : "failed");
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: Number("${{ needs.start.outputs.comment_id }}"),
              body: [
                "<!-- sofcat-integration-status -->",
                `Windows integration test ${state}.`,
                "",
                `Run: ${runUrl}`
              ].join("\n")
            });
