name: UI Client Test
on:
  push:
    branches:
      - main
    paths:
      - ui/**
      - '!ui/*.md'
      - '!ui/**/*.md'
      - pkg/service/**
      - cmd/sofcat/**
      - go.mod
      - go.sum
      - justfile
      - .github/workflows/ui-client-test.yml
  pull_request:
    paths:
      - ui/**
      - '!ui/*.md'
      - '!ui/**/*.md'
      - pkg/service/**
      - cmd/sofcat/**
      - go.mod
      - go.sum
      - justfile
      - .github/workflows/ui-client-test.yml
permissions:
  contents: read
jobs:
  build:
    name: SofCat UI Lint, Test And Build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: ui/frontend
        run: npm ci
      - name: Regenerate Wails bindings
        working-directory: ui
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 generate bindings -clean -ts -noevents -d frontend/bindings .
      - name: Verify committed bindings are current
        run: |
          $changed = git status --porcelain -- ui/frontend/bindings
          if ($changed) { $changed; throw "Committed Wails bindings are stale; regenerate and commit." }
      - name: Frontend type check
        working-directory: ui/frontend
        run: npm run check
      - name: Frontend tests
        working-directory: ui/frontend
        run: npm test
      - name: Frontend production assets
        working-directory: ui/frontend
        run: npm run build
      - name: Verify production bundle excludes the dev mock
        # Not -Quiet: piped to Select-String it emits one boolean per file, and a
        # non-empty array is truthy in PowerShell, so the check never passed.
        # Collecting matches also names the offending file when a leak is real.
        run: |
          $hits = Get-ChildItem -Path ui/frontend/dist -Recurse -File | Select-String -Pattern SOFCAT_VITE_MOCK_ONLY
          if ($hits) {
            $hits | ForEach-Object { Write-Host "leak: $($_.Path):$($_.LineNumber)" }
            throw "Dev mock leaked into the production bundle"
          }
          Write-Host "Production bundle is mock-free"
      - name: Go tests
        run: go test -cover ./...
      - name: Build sofcat-ui.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -tags production -ldflags "-H windowsgui" -o build/sofcat-ui.exe ./ui
