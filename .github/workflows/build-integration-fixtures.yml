name: Build Integration Fixtures
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Integration Fixtures
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare released-binary integration fixtures
        shell: pwsh
        run: |
          $workRoot = "$env:RUNNER_TEMP\sofcat-release-integration"
          ./test/integration/prepare-release-integration.ps1 `
            -WorkRoot "$workRoot"
      - name: Upload integration fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofcat-release-fixtures
          path: ${{ runner.temp }}/sofcat-release-integration/fixture
          if-no-files-found: error
