name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for `just lint` new-from-merge-base
      # check-xplat compiles the Wails UI for Linux, which needs GTK4 and WebKitGTK.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: jdx/mise-action@v2
      - run: just fmt-check
      - run: just lint origin/${{ github.base_ref || 'main' }}
      - run: just build
      - run: just check-xplat
