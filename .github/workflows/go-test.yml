name: go-test
on:
  push:
    branches:
      - main
    paths:
      - cmd/**
      - pkg/**
      - test/**
      - ui/*.go
      - justfile
      - mise.toml
      - go.mod
      - go.sum
      - .github/workflows/go-test.yml
  pull_request:
    paths:
      - cmd/**
      - pkg/**
      - test/**
      - ui/*.go
      - justfile
      - mise.toml
      - go.mod
      - go.sum
      - .github/workflows/go-test.yml
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Vet
        run: just vet
      - name: Test
        run: just test
