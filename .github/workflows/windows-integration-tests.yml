name: Windows Integration Tests
on:
  workflow_dispatch:
  push:
    paths:
      - cmd/**
      - pkg/**
      - integration/windows/**
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
  pull_request:
    paths:
      - cmd/**
      - pkg/**
      - integration/windows/**
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
permissions:
  contents: read
jobs:
  integration-tests:
    name: Windows Integration Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build sofcat.exe
        shell: pwsh
        run: |
          $outDir = "${{ runner.temp }}\sofcat-binary"
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          go build -v -o "$outDir\sofcat.exe" ./cmd/sofcat
      - name: Trust sideload certificate for msix fixtures
        shell: pwsh
        run: |
          $certPath = "${{ runner.temp }}\sofcat-it-sideload.cer"
          # Create a self-signed cert matching the Publisher in AppxManifest.xml (CN=SofCatIT)
          $cert = New-SelfSignedCertificate `
            -Subject "CN=SofCatIT" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Type CodeSigningCert `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          Export-Certificate -Cert $cert -FilePath $certPath | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null
          Write-Host "[INFO] Sideload certificate installed: $($cert.Thumbprint)"
      - name: Prepare integration fixtures
        shell: pwsh
        run: |
          $cert = Get-ChildItem -Path "Cert:\CurrentUser\My" |
            Where-Object { $_.Subject -eq "CN=SofCatIT" } |
            Select-Object -First 1
          ./integration/windows/prepare-release-integration.ps1 `
            -WorkRoot "${{ runner.temp }}\sofcat-release-integration" `
            -MsixCertThumbprint $cert.Thumbprint
      - name: Run integration tests
        shell: pwsh
        run: |
          ./integration/windows/run-release-integration.ps1 `
            -WorkRoot "${{ runner.temp }}\sofcat-release-integration" `
            -SofCatExePath "${{ runner.temp }}\sofcat-binary\sofcat.exe"
