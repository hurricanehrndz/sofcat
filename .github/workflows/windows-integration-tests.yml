name: Windows Integration Tests
on:
  workflow_dispatch:
  push:
    paths:
      - cmd/**
      - pkg/**
      - test/integration/**
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
  pull_request:
    paths:
      - cmd/**
      - pkg/**
      - test/integration/**
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
permissions:
  contents: read
jobs:
  integration-tests:
    name: Windows Integration Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build sofcat.exe
        shell: pwsh
        run: |
          $outDir = "${{ runner.temp }}\sofcat-binary"
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          go build -v -o "$outDir\sofcat.exe" ./cmd/sofcat
      - name: Prepare integration fixtures
        shell: pwsh
        run: |
          $thumbprint = ./test/integration/new-sideload-cert.ps1
          ./test/integration/prepare-release-integration.ps1 `
            -WorkRoot "${{ runner.temp }}\sofcat-release-integration" `
            -MsixCertThumbprint $thumbprint
      - name: Run integration tests
        shell: pwsh
        run: |
          ./test/integration/run-release-integration.ps1 `
            -WorkRoot "${{ runner.temp }}\sofcat-release-integration" `
            -SofCatExePath "${{ runner.temp }}\sofcat-binary\sofcat.exe"
