name: Windows Integration Tests
on:
  workflow_dispatch:
  push:
    paths:
      - cmd/**
      - pkg/**
      - test/integration/**
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
  pull_request:
    paths:
      - cmd/**
      - pkg/**
      - test/integration/**
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
permissions:
  contents: read
jobs:
  integration-tests:
    name: Windows Integration Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build sofcat.exe
        shell: pwsh
        run: |
          $outDir = "${{ runner.temp }}\sofcat-binary"
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          go build -v -o "$outDir\sofcat.exe" ./cmd/sofcat
      - name: Prepare integration fixtures
        shell: pwsh
        run: |
          $thumbprint = ./test/integration/new-sideload-cert.ps1
          ./test/integration/prepare-release-integration.ps1 `
            -WorkRoot "${{ runner.temp }}\sofcat-release-integration" `
            -MsixCertThumbprint $thumbprint
      - name: Run integration tests
        shell: pwsh
        run: |
          ./test/integration/run-release-integration.ps1 `
            -WorkRoot "${{ runner.temp }}\sofcat-release-integration" `
            -SofCatExePath "${{ runner.temp }}\sofcat-binary\sofcat.exe"
