name: Build Release
# Trigger on every main branch push
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag
        id: create_tag
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "/[\\s]*/"
          version_format: "${major}.${minor}.${patch}"
          namespace: ''
          bump_each_commit: false
      - name: Install toolchain
        uses: jdx/mise-action@v2
      - name: Build executables, MSI and makecatalogs
        run: |
          just version=${{ steps.create_tag.outputs.version_tag }} build msi makecatalogs
      - name: Upload executables workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofcat-exe-release
          path: |
            ./build/sofcat.exe
            ./build/sofcat-ui.exe
            ./build/sofcat-*.msi
            ./build/makecatalogs-*
          if-no-files-found: error
      - name: Cut release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          prerelease: true
          artifacts: "./build/sofcat.exe,./build/sofcat-ui.exe,./build/sofcat-*.msi,./build/makecatalogs-*"
          tag: ${{ steps.create_tag.outputs.version_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
