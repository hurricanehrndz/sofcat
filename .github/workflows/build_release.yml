name: Build Release
# Cut a release by pushing a version tag for a commit on main:
#   git tag v1.11.0 origin/main && git push origin v1.11.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # cut the release
      id-token: write # sign the provenance with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Install toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          cache: false # a release builds from fresh tools, not a restored cache
      - name: Build executables, MSI and makecatalogs
        run: just version="$GITHUB_REF_NAME" msi makecatalogs
      # SLSA build provenance for every release file, also attached to the
      # release so it can be checked offline:
      #   gh attestation verify <file> -R hurricanehrndz/sofcat --bundle sofcat-<tag>.sigstore.json
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/sofcat.exe
            build/sofcat-ui.exe
            build/sofcat-*.msi
            build/makecatalogs-*
      - name: Stage provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "build/sofcat-${GITHUB_REF_NAME}.sigstore.json"
      - name: Upload executables workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofcat-exe-release
          path: |
            ./build/sofcat.exe
            ./build/sofcat-ui.exe
            ./build/sofcat-*.msi
            ./build/makecatalogs-*
          if-no-files-found: error
      - name: Cut release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: false
          prerelease: true
          artifacts: "./build/sofcat.exe,./build/sofcat-ui.exe,./build/sofcat-*.msi,./build/makecatalogs-*,./build/sofcat-*.sigstore.json"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
  integration:
    name: Released-binary integration
    needs: build
    uses: ./.github/workflows/windows-release-integration.yml
    # The called workflow's PR-reporting jobs declare checks/pull-requests
    # write, so the caller has to allow them even though they are skipped
    # here; its integration job itself stays read-only.
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
