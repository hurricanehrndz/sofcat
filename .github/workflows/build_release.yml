name: Build Release
# Trigger on every main branch push
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # The version comes from the latest tag, so builds must not overlap: two at
    # once compute the same tag and the second fails to cut its release. A
    # queued build replaced by a newer push is canceled; the newer release
    # includes its commit. Only this job queues: integration runs after the
    # release is cut.
    concurrency:
      group: build-release
      cancel-in-progress: false
    permissions:
      contents: write # push the version tag and cut the release
      id-token: write # sign the provenance with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Create version tag
        id: create_tag
        uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "/[\\s]*/"
          version_format: "${major}.${minor}.${patch}"
          namespace: ''
          bump_each_commit: false
      - name: Install toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Build executables, MSI and makecatalogs
        run: |
          just version=${{ steps.create_tag.outputs.version_tag }} msi makecatalogs
      # SLSA build provenance for every release file, also attached to the
      # release so it can be checked offline:
      #   gh attestation verify <file> -R hurricanehrndz/sofcat --bundle sofcat-<tag>.sigstore.json
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/sofcat.exe
            build/sofcat-ui.exe
            build/sofcat-*.msi
            build/makecatalogs-*
      - name: Stage provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.create_tag.outputs.version_tag }}
        run: cp "$BUNDLE" "build/sofcat-${TAG}.sigstore.json"
      - name: Upload executables workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofcat-exe-release
          path: |
            ./build/sofcat.exe
            ./build/sofcat-ui.exe
            ./build/sofcat-*.msi
            ./build/makecatalogs-*
          if-no-files-found: error
      - name: Cut release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: false
          prerelease: true
          artifacts: "./build/sofcat.exe,./build/sofcat-ui.exe,./build/sofcat-*.msi,./build/makecatalogs-*,./build/sofcat-*.sigstore.json"
          tag: ${{ steps.create_tag.outputs.version_tag }}
          # Tag the commit that was built, not wherever main points by now.
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
  integration:
    name: Released-binary integration
    needs: build
    uses: ./.github/workflows/windows-release-integration.yml
    # The called workflow's PR-reporting jobs declare checks/pull-requests
    # write, so the caller has to allow them even though they are skipped
    # here; its integration job itself stays read-only.
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
